name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job pour vérifier la syntaxe et les dépendances
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

  # Job pour builder l'image Docker
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job pour tester le docker-compose
  test-docker-compose:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    needs: build-docker
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ocoffee-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start PostgreSQL with Docker Compose
        env:
          PORT: 3000
          POSTGRES_USER: ocoffee
          POSTGRES_PASSWORD: ocoffee123
          POSTGRES_DB: ocoffee
          POSTGRES_PORT: 5432
        run: |
          # Lancer PostgreSQL avec les variables d'environnement
          POSTGRES_USER=ocoffee POSTGRES_PASSWORD=ocoffee123 POSTGRES_DB=ocoffee docker compose -f docker-compose.yml up -d postgres
          sleep 15
          
          # Vérifier que PostgreSQL est prêt
          docker compose -f docker-compose.yml ps
          docker logs ocoffee-db || true

      - name: Test application container
        env:
          PORT: 3000
          POSTGRES_USER: ocoffee
          POSTGRES_PASSWORD: ocoffee123
          POSTGRES_DB: ocoffee
        run: |
          # Utiliser le réseau créé par docker-compose (format: <dossier>_<nom-reseau>)
          NETWORK_NAME="ocoffee_ocoffee-network"
          
          # Vérifier que le réseau existe, sinon le créer
          if ! docker network inspect $NETWORK_NAME >/dev/null 2>&1; then
            echo "Création du réseau $NETWORK_NAME"
            docker network create $NETWORK_NAME
            # Connecter PostgreSQL au réseau
            docker network connect $NETWORK_NAME ocoffee-db || true
          fi
          
          # Lancer l'application sur le même réseau que PostgreSQL
          docker run -d --name test-app \
            --network $NETWORK_NAME \
            -e PORT=3000 \
            -e PG_URL=postgresql://ocoffee:ocoffee123@postgres:5432/ocoffee \
            -p 3000:3000 \
            ocoffee-app:test
          
          # Attendre que l'application démarre
          echo "⏳ Attente du démarrage de l'application (20 secondes)..."
          sleep 20
          
          # Vérifier les logs pour diagnostiquer
          echo "📋 Logs de l'application:"
          docker logs test-app
          
          # Vérifier le statut du conteneur
          echo "📊 Statut des conteneurs:"
          docker ps -a | grep -E "(test-app|ocoffee)"
          
          # Vérifier que le port est bien exposé
          echo "🔍 Vérification du port 3000:"
          netstat -tlnp 2>/dev/null | grep 3000 || ss -tlnp 2>/dev/null | grep 3000 || echo "Port 3000 non trouvé"
          
          # Test si l'application répond
          echo "🧪 Test de connexion à l'application..."
          SUCCESS=false
          for i in {1..5}; do
            if curl -f http://localhost:3000 >/dev/null 2>&1; then
              echo "✅ Application répond correctement"
              SUCCESS=true
              break
            fi
            echo "Tentative $i/5 échouée, nouvelle tentative dans 5 secondes..."
            sleep 5
          done
          
          # Si le test a échoué
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ L'application ne répond pas après 5 tentatives"
            docker logs test-app
            exit 1
          fi
          
      - name: Cleanup
        if: always()
        run: |
          docker stop test-app || true
          docker rm test-app || true
          POSTGRES_USER=ocoffee POSTGRES_PASSWORD=ocoffee123 POSTGRES_DB=ocoffee docker compose -f docker-compose.yml down -v || true
