name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job pour vérifier la syntaxe et les dépendances
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

  # Job pour builder l'image Docker
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job pour tester le docker-compose
  test-docker-compose:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    needs: build-docker
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ocoffee-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start PostgreSQL with Docker Compose
        run: |
          docker-compose -f docker-compose.yml up -d postgres
          sleep 10

      - name: Test application container
        env:
          PORT: 3000
          POSTGRES_USER: ocoffee
          POSTGRES_PASSWORD: ocoffee123
          POSTGRES_DB: ocoffee
          PG_URL: postgresql://ocoffee:ocoffee123@localhost:5432/ocoffee
        run: |
          docker run -d --name test-app \
            --network host \
            -e PORT=3000 \
            -e PG_URL=postgresql://ocoffee:ocoffee123@localhost:5432/ocoffee \
            ocoffee-app:test
          
          sleep 10
          
          # Test si l'application répond
          curl -f http://localhost:3000 || exit 1
          
          echo "✅ Application répond correctement"
          docker logs test-app
          
          # Nettoyage
          docker stop test-app || true
          docker rm test-app || true
          docker-compose -f docker-compose.yml down -v || true
